<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Miner Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #181b22;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        h1 { color: #f59e0b; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        #scoreDisplay {
            font-size: 54px;
            font-weight: bold;
            color: #10b981;
            margin: 15px 0;
        }
        .tap-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #991b1b;
            transition: all 0.08s ease;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tap-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #991b1b;
        }
        .input-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="text"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #111318;
            color: white;
            font-size: 14px;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #f59e0b;
        }
        .btn-submit {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: #2563eb; }
        
        #statusMessage {
            margin-top: 12px;
            font-size: 13px;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }
        .status-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #059669; }
        .status-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #dc2626; }

        .leaderboard-section {
            margin-top: 30px;
            text-align: left;
            background: #111318;
            padding: 15px;
            border-radius: 10px;
        }
        .leaderboard-section h3 { font-size: 15px; margin-bottom: 10px; color: #f59e0b; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px; border-bottom: 1px solid #222630; text-align: left; }
        th { color: #9ca3af; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>⛏️ Tap Miner Game</h1>
        <p class="subtitle">Tap tombol secepat mungkin, lalu simpan skormu!</p>
        
        <div id="scoreDisplay">0</div>
        
        <!-- Perbaikan event onclick langsung di tombol -->
        <button class="tap-btn" id="tapBtn">TAP!</button>
        
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Ketik Nama Kamu..." maxlength="15">
            <button class="btn-submit" id="submitBtn">Kirim Skor ke Leaderboard</button>
            <div id="statusMessage"></div>
        </div>

        <div class="leaderboard-section">
            <h3>🏆 Global Leaderboard (Top 5)</h3>
            <table>
                <thead>
                    <tr><th>No</th><th>Nama</th><th>Skor</th></tr>
                </thead>
                <tbody id="leaderboardTable">
                    <tr><td colspan="3" style="text-align: center; color: #888;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mvpcfkxciwqoerfsaidc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yvLG1lHpm_wks-Y9Uk6JQ_z5_ZMNQ6';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentScore = 0;
        const scoreDisplay = document.getElementById('scoreDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const tapBtn = document.getElementById('tapBtn');
        const submitBtn = document.getElementById('submitBtn');

        function showStatus(text, type) {
            statusMessage.innerText = text;
            statusMessage.style.display = 'block';
            statusMessage.className = type === 'success' ? 'status-success' : 'status-error';
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 4000);
        }

        // Event listener biar tombol TAP di HP langsung responsif
        tapBtn.addEventListener('click', () => {
            currentScore += 1;
            scoreDisplay.innerText = currentScore;
        });

        submitBtn.addEventListener('click', async () => {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim();

            if (!name) {
                showStatus('Wajib isi nama dulu bro!', 'error');
                return;
            }
            if (currentScore === 0) {
                showStatus('Main dulu minimal dapat beberapa skor!', 'error');
                return;
            }

            const { error } = await supabase
                .from('leaderboard')
                .insert([{ name: name, score: currentScore }]);

            if (error) {
                console.error('Gagal kirim:', error);
                showStatus('Gagal mengirim skor. Cek koneksi!', 'error');
            } else {
                showStatus('Berhasil! Skor masuk leaderboard.', 'success');
                nameInput.value = '';
                currentScore = 0;
                scoreDisplay.innerText = currentScore;
                fetchLeaderboard();
            }
        });

        async function fetchLeaderboard() {
            const tableBody = document.getElementById('leaderboardTable');
            try {
                const { data, error } = await supabase
                    .from('leaderboard')
                    .select('*')
                    .order('score', { ascending: false })
                    .limit(5);

                if (error) throw error;

                tableBody.innerHTML = '';

                if (!data || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888;">Belum ada skor</td></tr>`;
                    return;
                }

                data.forEach((row, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>#${index + 1}</td><td>${row.name}</td><td>${row.score}</td>`;
                    tableBody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ef4444;">Gagal memuat leaderboard</td></tr>`;
            }
        }

        fetchLeaderboard();
    </script>
</body>
</html>
